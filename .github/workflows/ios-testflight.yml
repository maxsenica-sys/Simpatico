# Builds the iPhone app (the Capacitor shell in mobile/) and uploads it to TestFlight.
# Run it from GitHub › Actions › "iPhone build to TestFlight" › Run workflow.
#
# Needs three repository secrets (Settings › Secrets and variables › Actions), from App Store
# Connect › Users and Access › Integrations › App Store Connect API (a Team key, Admin role):
#   APPSTORE_KEY_ID     the key's ID (10 characters)
#   APPSTORE_ISSUER_ID  the Issuer ID shown above the list of keys
#   APPSTORE_KEY_P8     the whole text of the downloaded AuthKey_XXXXXXXXXX.p8 file
# Signing is automatic: when uploading, Xcode creates the distribution certificate and App Store
# profile with that key.
name: iPhone build to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0)"
        required: false
        default: "1.0"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: P5C9YZ5CFB
      BUNDLE_ID: app.simpatico
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Native shell up to date
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: App Store Connect key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          test -n "$KEY_ID" && test -n "$KEY_P8" || { echo "Add the APPSTORE_* secrets first (see the top of this file)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # However the key text was pasted (one line, Windows line ends, without the BEGIN/END
          # lines), write it back in the exact shape Apple's tools read. Only its length is printed.
          OUT="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" python3 - <<'PY'
          import base64, os, re, sys
          raw = os.environ["KEY_P8"].replace("\r", "")
          body = re.sub(r"-+\s*(BEGIN|END)[A-Z ]*-+", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body, validate=True)
          except Exception:
              der = b""
          if len(der) < 100 or der[:1] != b"\x30":
              print(f"APPSTORE_KEY_P8 doesn't look like an App Store Connect key ({len(body)} characters). Paste the whole text of the AuthKey_....p8 file.")
              sys.exit(1)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          open(os.environ["OUT"], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          print(f"Key text looks right ({len(body)} characters).")
          PY
          KEY_ID_CLEAN=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          [ "$KEY_ID_CLEAN" = "$KEY_ID" ] || echo "Note: APPSTORE_KEY_ID had spaces or line breaks around it; use it without them."

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          # Every upload needs a higher build number than the last one.
          BUILD=$(( ${{ github.run_number }} + 1 ))
          # Built unsigned: signing for the App Store happens in the upload step (a signed archive
          # would need a development profile, which Apple only makes once a test iPhone is registered).
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="$BUILD" \
            archive | tail -n 40

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded. It appears in App Store Connect › TestFlight after Apple finishes processing (about 10–30 minutes)."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
