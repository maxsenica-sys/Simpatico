# Builds the iPhone app (the Capacitor shell in mobile/) and uploads it to TestFlight.
# Run it from GitHub › Actions › "iPhone build to TestFlight" › Run workflow.
#
# Needs three repository secrets (Settings › Secrets and variables › Actions), from App Store
# Connect › Users and Access › Integrations › App Store Connect API (a Team key, Admin role):
#   APPSTORE_KEY_ID     the key's ID (10 characters)
#   APPSTORE_ISSUER_ID  the Issuer ID shown above the list of keys
#   APPSTORE_KEY_P8     the whole text of the downloaded AuthKey_XXXXXXXXXX.p8 file
# Signing is automatic: Xcode creates the certificate and profile with that key.
name: iPhone build to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0)"
        required: false
        default: "1.0"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: P5C9YZ5CFB
      BUNDLE_ID: app.simpatico
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Native shell up to date
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: App Store Connect key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          test -n "$KEY_ID" && test -n "$KEY_P8" || { echo "Add the APPSTORE_* secrets first (see the top of this file)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        working-directory: mobile/ios/App
        run: |
          # Every upload needs a higher build number than the last one.
          BUILD=$(( ${{ github.run_number }} + 1 ))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="$BUILD" \
            archive | tail -n 40

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded. It appears in App Store Connect › TestFlight after Apple finishes processing (about 10–30 minutes)."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
