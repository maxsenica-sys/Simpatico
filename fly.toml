# One Fly app: Next.js + the WebSocket server in a single process.
# Rooms live in memory, so calls run on ONE machine, in primary_region (Frankfurt).
# A second machine in Sydney serves the app's pages to nearby phones and passes everything about
# calls on to Frankfurt with fly-replay (server.ts). Deploy with: fly deploy --ha=false
# Never add a second machine in fra: two call machines would split people in the same call.
app = "talk-calls"          # change to your app name
primary_region = "fra"      # Frankfurt: Fly's closest region to Turkey

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine up: stopping it would drop in-memory rooms whose links are already shared.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Development-phase store: tester feedback, client errors, one line per call (server/store.ts).
[mounts]
  source = "talk_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
