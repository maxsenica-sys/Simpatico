# One Fly app: Next.js + the WebSocket server in a single process.
# Rooms live in memory, so run exactly ONE machine:  fly deploy --ha=false
app = "talk-calls"          # change to your app name
primary_region = "syd"      # put it near your testers

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine up: stopping it would drop in-memory rooms whose links are already shared.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
