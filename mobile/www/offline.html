<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simpatico</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b0d10; color: #f4f5f7;
         font: 17px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 1.4rem; margin: 18px 0 6px; }
  p { color: #9aa3ad; margin: 0 0 24px; }
  button { font: inherit; font-weight: 650; border: 0; border-radius: 999px; padding: 14px 28px; background: #5b8cff; color: #fff; }
</style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="26" cy="28" r="20" fill="#5b8cff" opacity=".88"/><circle cx="38" cy="36" r="20" fill="#5fe0bd" opacity=".88"/></svg>
    <h1 id="t">No internet connection</h1>
    <p id="b">Connect to Wi-Fi or mobile data, then try again.</p>
    <button id="r" onclick="location.href = window.SIMPATICO_URL || '/'">Try again</button>
  </main>
  <script>
    // A few languages, matching the phone's language; English otherwise.
    var L = {
      tr: ["İnternet bağlantısı yok", "Wi-Fi'ye veya mobil veriye bağlan, sonra tekrar dene.", "Tekrar dene"],
      ru: ["Нет подключения к интернету", "Подключитесь к Wi-Fi или мобильному интернету и попробуйте снова.", "Повторить"],
      es: ["Sin conexión a internet", "Conéctate a wifi o datos móviles y vuelve a intentarlo.", "Reintentar"],
      fr: ["Pas de connexion internet", "Connectez-vous au Wi-Fi ou aux données mobiles, puis réessayez.", "Réessayer"],
      pt: ["Sem conexão com a internet", "Conecte-se ao Wi-Fi ou aos dados móveis e tente de novo.", "Tentar de novo"],
      ar: ["لا يوجد اتصال بالإنترنت", "اتصل بشبكة Wi-Fi أو بيانات الجوال ثم حاول مرة أخرى.", "حاول مرة أخرى"],
      zh: ["没有网络连接", "请连接 Wi-Fi 或移动数据后重试。", "重试"]
    };
    var l = L[(navigator.language || "en").slice(0, 2)];
    if (l) { t.textContent = l[0]; b.textContent = l[1]; r.textContent = l[2]; if (/^ar/.test(navigator.language)) document.dir = "rtl"; }
  </script>
</body>
</html>
